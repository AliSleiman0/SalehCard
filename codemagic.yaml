workflows:
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    # App Store Connect API key added in Codemagic (Teams > Integrations >
    # Developer Portal), referenced by its name there.
    integrations:
      app_store_connect: Apple Distribution
    environment:
      flutter: 3.44.8
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flashcashglobal.app
      vars:
        BUNDLE_ID: "com.flashcashglobal.app"
        # Without this the build bakes in the dev LAN API and hangs on real
        # devices (see the Android APK note in project memory).
        API_BASE_URL: "https://salehcard-api.azurewebsites.net/api/v1"
        # App Store Connect app record (Apple ID) for FlashCash Global — used to
        # read the latest uploaded build number (see the build step).
        APP_STORE_APPLE_ID: "6822703792"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    # Only build when the Flutter app changed, so api/web/admin commits don't
    # burn macOS minutes.
    when:
      changeset:
        includes:
          - 'app/'
          - 'codemagic.yaml'
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa
        # No `pod install` step: this project uses Swift Package Manager for
        # plugin integration (there is no ios/Podfile), so Xcode resolves
        # Firebase/plugin dependencies itself as part of the build.
        # Build number = one past the highest build already in App Store
        # Connect, so uploads never collide even if Codemagic's per-workflow
        # BUILD_NUMBER counter resets (workflow recreated/renamed). The old
        # counter formula (4 + BUILD_NUMBER) is kept as a floor, and as the
        # fallback if the App Store Connect lookup fails.
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          COUNTER=$((4 + BUILD_NUMBER))
          if [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            NEXT=$((LATEST + 1))
            if [ "$COUNTER" -gt "$NEXT" ]; then NEXT=$COUNTER; fi
          else
            echo "WARNING: could not read the latest TestFlight build number; falling back to $COUNTER"
            NEXT=$COUNTER
          fi
          echo "Building iOS build number $NEXT (latest in App Store Connect: ${LATEST:-unknown})"
          flutter build ipa --release \
            --build-number=$NEXT \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads land in TestFlight for internal testers automatically;
        # external beta review is not needed for now.
        submit_to_testflight: false
